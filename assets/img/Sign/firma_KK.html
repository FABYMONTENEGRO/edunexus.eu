<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .signature {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 500px;
            border-left: 4px solid #1E88E5;
            padding-left: 15px;
            margin: 10px 0;
        }
        .name {
            font-size: 18px;
            font-weight: bold;
            color: #1E88E5;
            margin: 0;
            line-height: 1.2;
        }
        .title {
            font-size: 14px;
            color: #666;
            margin: 2px 0 8px 0;
            font-weight: 500;
        }
        .company {
            font-size: 14px;
            color: #333;
            margin: 0 0 8px 0;
            font-weight: 600;
        }
        .contact-info {
            font-size: 12px;
            color: #666;
            line-height: 1.4;
        }
        .contact-info a {
            color: #1E88E5;
            text-decoration: none;
        }
        .contact-info a:hover {
            text-decoration: underline;
        }
        .logo {
            float: right;
            margin-left: 15px;
            margin-top: -10px;
        }
        .logo img {
            width: 80px;
            height: auto;
        }
        .website {
            color: #1E88E5;
            font-weight: 600;
            margin-top: 5px;
        }
        .divider {
            color: #ccc;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="signature">
        <div class="logo">
            <img src="/assets/img/Sign/Logo.png" alt="EduNexus Logo" />
        </div>
        <p class="name">Kajsa Kjellstrom</p>
        <p class="title">Director</p>
        <p class="company">Edu Nexus Consulting Ltd.</p>
        <div class="contact-info">
            <a href="mailto:kajsa.kjellstrom@edunexus.eu">kajsa.kjellstrom@edunexus.eu</a>
            <span class="divider">|</span>
            <a href="tel:+353 863688624">+353 863688624</a><br>
            Dublin, Ireland<br>
            <div class="website">
                <a href="https://www.edunexus.eu">www.edunexus.eu</a>
            </div>
        </div>
    </div>
</body>
</html>
